name: Update Cloaking Rules

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tarik Hagezi Normal + Pro
        run: |
          curl -sL --fail \
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/normal.txt" \
            -o hagezi_normal.txt

          curl -sL --fail \
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt" \
            -o hagezi_pro.txt

          cat hagezi_normal.txt hagezi_pro.txt \
            | grep -v '^#' \
            | grep -v '^\s*$' \
            | awk '{sub(/\r$/, ""); gsub(/^0\.0\.0\.0 /, ""); gsub(/^127\.0\.0\.1 /, ""); print $1" 0.0.0.0"}' \
            | sort -u \
            > cloaking_merged.txt

          cat <<'EOF' > whitelist.txt
          # IDX & static
          idx.co.id
          www.idx.co.id
          static.idx.co.id
          assets.idx.co.id

          # Bank BCA
          bca.co.id
          klikbca.com
          m.klikbca.com
          api.klikbca.com
          mybca.bca.co.id
          ocw.bca.co.id

          # Bank Jago
          jago.com
          www.jago.com
          api.jago.com
          app.jago.com
          cdn.jago.com

          # GoPay & Gojek
          gojek.com
          www.gojek.com
          api.gojek.com
          gopay.co.id
          www.gopay.co.id
          api.gopay.co.id
          gopay-id.com
          goapi.go-jek.com
          api.go-jek.com
          static.gojek.com
          cdn.gojek.com
          pa.gojek.com

          # Stockbit
          stockbit.com
          www.stockbit.com
          api.stockbit.com
          static.stockbit.com
          cdn.stockbit.com
          app.stockbit.com
          stream.stockbit.com

          # Bibit
          bibit.id
          www.bibit.id
          api.bibit.id
          cdn.bibit.id
          static.bibit.id
          app.bibit.id

          # Tokopedia
          tokopedia.com
          www.tokopedia.com
          api.tokopedia.com
          ta.tokopedia.com
          images.tokopedia.net
          tokopedia.net
          tokopedia-static.net

          # Mi Shop / Xiaomi
          mishop.id
          www.mishop.id
          mi.com
          global.mi.com
          buy.mi.com
          shop.mi.com
          static.mi.com
          i01.appmifile.com
          i02.appmifile.com

          # IPOT
          ipot.co.id
          www.ipot.co.id
          api.ipot.co.id

          # KSEI
          ksei.co.id
          www.ksei.co.id

          # Common CDN
          jsdelivr.net
          unpkg.com
          cdnjs.cloudflare.com
          akamaized.net
          fastly.net
          cloudfront.net
          EOF

          grep -v '^\s*#' whitelist.txt \
            | grep -v '^\s*$' \
            | sed 's/^[[:space:]]*//' \
            | while read domain; do
                sed -i "/^${domain} /d" cloaking_merged.txt
              done

          mv cloaking_merged.txt cloaking.txt
          rm -f hagezi_normal.txt hagezi_pro.txt whitelist.txt

          echo "Total rules: $(wc -l < cloaking.txt)"

      - name: Simpan ke Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloaking.txt
          git commit -m "Auto-update: Hagezi Normal + Pro $(date +'%Y-%m-%d')" || exit 0
          git push
