name: Update Cloaking Rules

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tarik OISD Small (Wildcard Asterisk)
        run: |
          # Langsung sedot versi "raw domains" dari OISD Small
          curl -sL "https://small.oisd.nl/domains" -o oisd_small.txt

          echo "Total baris mentahan dari OISD Small: $(wc -l < oisd_small.txt)"

          # Filter bersih-bersih dan format jadi "*.domain.com 0.0.0.0"
          # Logika: Hapus komentar/baris kosong, buang karakter gaib, tambah *. di depan dan 0.0.0.0 di belakang
          cat oisd_small.txt | grep -v '^#' | grep -v '^\s*$' | awk '{sub(/\r$/, ""); print "*."$1" 0.0.0.0"}' | sort -u > cloaking.txt

          # Buang file mentahan biar bersih
          rm -f oisd_small.txt

          echo "Total rules siap pakai: $(wc -l < cloaking.txt)"

      - name: Simpan ke Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloaking.txt
          
          # Cek ada perubahan atau tidak sebelum push (Biar log commit nggak nyampah)
          if git diff --staged --quiet; then
            echo "Tidak ada update rule baru, skip push."
          else
            git commit -m "Auto-update: OISD Small Wildcard $(date +'%Y-%m-%d')"
            git push
          fi
          
