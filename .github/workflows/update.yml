name: Update Cloaking Rules

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tarik Hagezi Multi Light (Wildcard Asterisk)
        run: |
          # Langsung sedot versi Wildcard Light
          curl -sL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/light.txt" -o hagezi_light.txt

          echo "Total baris dari Hagezi Wildcard Light: $(wc -l < hagezi_light.txt)"

          # Filter bersih-bersih dan format jadi "*.domain 0.0.0.0"
          # (Hapus spasi kosong/komentar, lalu tempel 0.0.0.0 di belakangnya)
          cat hagezi_light.txt | grep -v '^#' | grep -v '^\s*$' | awk '{sub(/\r$/, ""); print $1" 0.0.0.0"}' | sort -u > cloaking.txt

          # Buang file mentahan biar bersih
          rm -f hagezi_light.txt

          echo "Total rules siap pakai: $(wc -l < cloaking.txt)"

      - name: Simpan ke Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloaking.txt
          
          # Cek ada perubahan atau tidak sebelum push
          if git diff --staged --quiet; then
            echo "Tidak ada update rule baru, skip push."
          else
            git commit -m "Auto-update: Hagezi Multi Light Wildcard $(date +'%Y-%m-%d')"
            git push
          fi
          
