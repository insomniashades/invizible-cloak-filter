name: Update Cloaking Rules

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tarik OISD Small (Wildcard Asterisk)
        run: |
          echo "Menarik list OISD Small dari jalur utama..."
          # Jalur 1: Official OISD (pakai User-Agent browser biar gak dikira bot jahat)
          curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://small.oisd.nl/domainswild" -o oisd_small.txt

          # Pengecekan Logis: Kalau isinya kata "error", atau filenya kosong, atau isinya dikit banget (biasanya HTML nyasar), ganti jalur!
          if grep -iq "^error$" oisd_small.txt || [ ! -s oisd_small.txt ] || [ $(wc -l < oisd_small.txt) -lt 100 ]; then
            echo "Jalur utama diblokir/error. Beralih narik langsung dari dapur repository OISD..."
            # Jalur 2: Sedot dari file raw di GitHub aslinya developer OISD
            curl -sL "https://raw.githubusercontent.com/sjhgvr/oisd/main/domainswild2_small.txt" -o oisd_small.txt
          fi

          echo "Total baris mentahan yang berhasil ditarik: $(wc -l < oisd_small.txt)"

          # Filter bersih-bersih dan format jadi "*.domain.com 0.0.0.0"
          # Logika AWK: Hapus enter gaib, bersihin kalau ada *. bawaan (biar gak dobel), lalu tempel *. dan 0.0.0.0
          cat oisd_small.txt | grep -v '^#' | grep -v '^\s*$' | awk '{sub(/\r$/, ""); sub(/^\*\./, ""); print "*."$1" 0.0.0.0"}' | sort -u > cloaking.txt

          # Buang file mentahan
          rm -f oisd_small.txt

          echo "Total rules siap pakai: $(wc -l < cloaking.txt)"

      - name: Simpan ke Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloaking.txt
          
          if git diff --staged --quiet; then
            echo "Tidak ada update rule baru, skip push."
          else
            git commit -m "Auto-update: OISD Small Wildcard $(date +'%Y-%m-%d')"
            git push
          fi
          
