name: Update HaGeZi Multi Normal Filter
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: Hagezi-Multi-Normal

      - name: Fetch and Format HaGeZi Multi Normal List
        run: |
          echo "==== START FETCHING HAGEZI MULTI NORMAL ===="
          
          OUTPUT_FILE="hagezi-normal-cloak.txt"
          
          # Daftar URL Primary & Mirror CDN Terpercaya (jsDelivr)
          URLS=(
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/normal.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@main/wildcard/normal.txt"
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/normal.txt"
            "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@main/domains/normal.txt"
          )
          
          DOWNLOAD_SUCCESS=false
          
          # Loop buat nyoba tiap URL sampai ada yang berhasil
          for URL in "${URLS[@]}"; do
            echo "Nge-fetch dari: $URL"
            if curl -sSLf --connect-timeout 10 --max-time 30 "$URL" -o raw_hagezi.txt && [ -s raw_hagezi.txt ]; then
              echo "SUCCESS: Berhasil unduh dari $URL"
              DOWNLOAD_SUCCESS=true
              break
            else
              echo "WARNING: Gagal atau file kosong dari $URL, nyoba mirror berikutnya..."
            fi
          done
          
          if [ "$DOWNLOAD_SUCCESS" = false ]; then
            echo "ERROR: Semua URL primary & mirror gagal diakses!"
            exit 1
          fi

          # Bikin Header Rapi dengan Timestamp UTC
          cat <<EOF > "$OUTPUT_FILE"
          # =========================================================
          # HaGeZi Multi Normal - Cloaking Filter for InviZible Pro
          # Updated on : $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          # Source     : https://github.com/hagezi/dns-blocklists
          # Format     : DNSCrypt Cloaking Rules (<domain> 0.0.0.0)
          # =========================================================

          EOF

          # Parsing & Formatting
          awk '/^[^\#]/ && NF && !/404:/ { print $1 " 0.0.0.0" }' raw_hagezi.txt >> "$OUTPUT_FILE"

          rm raw_hagezi.txt
          echo "==== FORMATTING COMPLETE: Saved to $OUTPUT_FILE ===="

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --staged --quiet; then
            echo "Kagak ada perubahan dari upstream HaGeZi. Skip commit!"
          else
            git commit -m "build(filter): auto-update HaGeZi Multi Normal [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin Hagezi-Multi-Normal
          fi
          cat <<EOF > "$OUTPUT_FILE"
          # =========================================================
          # HaGeZi Multi Normal - Cloaking Filter for InviZible Pro
          # Updated on : $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          # Source     : https://github.com/hagezi/dns-blocklists
          # Format     : DNSCrypt Cloaking Rules (<domain> 0.0.0.0)
          # =========================================================

          EOF

          # 3. Parsing & Formatting:
          # - /^[^\#]/ : Abaikan baris komentar (#)
          # - NF       : Abaikan baris kosong
          # - Transformasi baris jadi: "<domain/wildcard> 0.0.0.0"
          awk '/^[^\#]/ && NF { print $1 " 0.0.0.0" }' raw_hagezi.txt >> "$OUTPUT_FILE"

          # 4. Bersihin file temporary
          rm raw_hagezi.txt
          echo "==== FORMATTING COMPLETE: Saved to $OUTPUT_FILE ===="

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          # Cek perubahan biar gak spamming commit kosong kalau isi list belum berubah dari upstream
          if git diff --staged --quiet; then
            echo "Kagak ada perubahan dari upstream HaGeZi. Skip commit!"
          else
            git commit -m "build(filter): auto-update HaGeZi Multi Normal [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin Hagezi-Multi-Normal
          fi
          
