name: Update Hagezi Normal Cloak

on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Tarik dan Racik Hagezi Normal
        run: |
          # 1. Sedot list murni Hagezi Normal (nama filenya multi.txt). 
          # Parameter --fail bikin proses stop kalau URL salah/mati.
          curl -sL --fail "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/multi.txt" -o raw.txt
          
          # 2. Filter komentar (#), hapus baris kosong & format Windows (\r), lalu format jadi "[domain] 0.0.0.0"
          grep -v '^#' raw.txt | grep -v '^\s*$' | awk '{sub(/\r$/, ""); print $1" 0.0.0.0"}' > cloaking.txt
          
          # 3. Bersihkan file mentah
          rm raw.txt

      - name: Simpan ke Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloaking.txt
          git commit -m "Auto-update Hagezi Normal ke format Cloaking" || exit 0
          git push
          
