name: Update HaGeZi Multi Normal Filter

on:
  schedule:
    # Jalan otomatis tiap jam 03:00 UTC (Jam 10:00 WIB pagi)
    - cron: '0 3 * * *'
  workflow_dispatch: # Tombol manual trigger di tab GitHub Actions

# Permission wajib supaya bot GitHub Actions punya izin push commit ke repo
permissions:
  contents: write

jobs:
  update-filter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: Hagezi-Multi-Normal # Kunci ke branch Hagezi-Multi-Normal

      - name: Fetch and Format HaGeZi Multi Normal List
        run: |
          echo "==== START FETCHING HAGEZI MULTI NORMAL ===="
          
          # URL Source Wildcard HaGeZi Multi Normal
          SOURCE_URL="https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/normal.txt"
          
          # Tentukan nama file hasil akhir di repo lu (Sesuaikan jika nama filenya beda)
          OUTPUT_FILE="hagezi-normal-cloak.txt"
          
          # 1. Unduh list mentah dari HaGeZi
          curl -sSL "$SOURCE_URL" -o raw_hagezi.txt

          # 2. Bikin Header Rapi dengan Timestamp UTC
          cat <<EOF > "$OUTPUT_FILE"
          # =========================================================
          # HaGeZi Multi Normal - Cloaking Filter for InviZible Pro
          # Updated on : $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          # Source     : https://github.com/hagezi/dns-blocklists
          # Format     : DNSCrypt Cloaking Rules (<domain> 0.0.0.0)
          # =========================================================

          EOF

          # 3. Parsing & Formatting:
          # - /^[^\#]/ : Abaikan baris komentar (#)
          # - NF       : Abaikan baris kosong
          # - Transformasi baris jadi: "<domain/wildcard> 0.0.0.0"
          awk '/^[^\#]/ && NF { print $1 " 0.0.0.0" }' raw_hagezi.txt >> "$OUTPUT_FILE"

          # 4. Bersihin file temporary
          rm raw_hagezi.txt
          echo "==== FORMATTING COMPLETE: Saved to $OUTPUT_FILE ===="

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          # Cek perubahan biar gak spamming commit kosong kalau isi list belum berubah dari upstream
          if git diff --staged --quiet; then
            echo "Kagak ada perubahan dari upstream HaGeZi. Skip commit!"
          else
            git commit -m "build(filter): auto-update HaGeZi Multi Normal [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin Hagezi-Multi-Normal
          fi
          
