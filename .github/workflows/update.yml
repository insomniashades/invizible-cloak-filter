name: Update Cloaking Rules (Hagezi Pro)

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Tarik Hagezi Pro
        run: |
          echo "Menarik list Hagezi Pro dari jalur utama (GitHub Raw)..."
          # Jalur 1: Ambil langsung dari repo raw Hagezi
          curl -sL "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/domains/pro.txt" -o hagezi_pro.txt

          # Pengecekan Logis: Kalau filenya error 404, kosong, atau isinya kedikitan (di bawah 1000 baris), ganti jalur!
          if grep -iq "^404" hagezi_pro.txt || [ ! -s hagezi_pro.txt ] || [ $(wc -l < hagezi_pro.txt) -lt 1000 ]; then
            echo "Jalur utama bermasalah. Beralih ke jalur cadangan (CDN jsDelivr)..."
            # Jalur 2: Sedot via CDN jsDelivr sebagai backup
            curl -sL "https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@main/domains/pro.txt" -o hagezi_pro.txt
          fi

          echo "Total baris mentahan yang berhasil ditarik: $(wc -l < hagezi_pro.txt)"

          # Filter bersih-bersih dan format jadi "*.domain.com 0.0.0.0"
          # Logika AWK: Buang baris komentar (#), hapus enter gaib, bersihin *. bawaan (biar gak dobel), lalu tempel *. dan 0.0.0.0
          cat hagezi_pro.txt | grep -v '^#' | grep -v '^\s*$' | awk '{sub(/\r$/, ""); sub(/^\*\./, ""); print "*."$1" 0.0.0.0"}' | sort -u > cloaking.txt

          # Buang file mentahan
          rm -f hagezi_pro.txt

          echo "Total rules siap pakai: $(wc -l < cloaking.txt)"

      - name: Simpan ke Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cloaking.txt
          
          if git diff --staged --quiet; then
            echo "Tidak ada update rule baru, skip push."
          else
            git commit -m "Auto-update: Hagezi Pro Cloaking $(date +'%Y-%m-%d')"
            git push
          fi
          
